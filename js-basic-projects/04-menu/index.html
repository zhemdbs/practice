<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>

  <!-- styles -->
  <link rel="stylesheet" href="../common.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
</head>
<body>
  <div class="container">
    <div class="container__inner">
      <h1 class="title">Our Menu</h1>
      <div class="menu__box">
        <div class="menu__category">
          <div class="menu__category-option" data-category="all">
            <button class="menu__category-btn">All</button>
          </div>
          <div class="menu__category-option" data-category="breakfast">
            <button class="menu__category-btn">Breakfast</button>
          </div>
          <div class="menu__category-option" data-category="lunch">
            <button class="menu__category-btn">Lunch</button>
          </div>
          <div class="menu__category-option" data-category="shakes">
            <button class="menu__category-btn">Shakes</button>
          </div>
          <div class="menu__category-option" data-category="dinner">
            <button class="menu__category-btn">Dinner</button>
          </div>
        </div>
        <div class="menu">
          <div class="menu__inner">
            <!-- menu -->
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- javascript -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
