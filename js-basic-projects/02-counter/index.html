<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>

  <!-- styles -->
  <link rel="stylesheet" href="../common.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="container__inner">
      <h1 class="title">Counter</h1>
      <h2 class="counter__num">0</h2>
      <div class="counter__btn-wrap">
        <button class="counter__btn counter__btn--down" data-button="down">DECREASE</button>
        <button class="counter__btn counter__btn--reset" data-button="reset">RESET</button>
        <button class="counter__btn counter__btn--up" data-button="up">INCREASE</button>
      </div>
    </div>
  </div>
  <!-- javascript -->
  <script src="main.js"></script>
</body>
</html>
